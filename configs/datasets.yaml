# ============================================================================
# Classification Transcriptomic with XAI
# Dataset Registry (run-time config)
# ============================================================================
# Paths are relative to the project root (the folder containing configs/).
# One entry per dataset — both the probe-level and gene-level CSVs built from
# the same GEO/CuMiDa series are merged here (see `levels`) instead of
# duplicating the entry. Build-time-only fields (series_matrix,
# class_characteristic, …) live in configs/dataset_origin.yaml.
#
# Every dataset here is CuMiDa-format on disk (samples, type, feature_1, …) —
# there's no other run-time format, so there's no `type` field to set.
#
# Set enabled: true to include a dataset in pipeline runs. `levels` lists
# which CSVs this entry can run as; the pipeline expands each enabled entry
# into one run-key per level — "<name>" for "probe", "<name>-gene" for "gene"
# — so outputs/ folder names are unaffected by this config split.
#
# platform: GPL accession (e.g. "GPL570"); used for probe→gene annotation.
# annotation_file / mapping_file stay here (not only in dataset_origin.yaml)
# because the pipeline reads them at run time to label SHAP/rule features
# with gene symbols.

datasets:

  GEO-Breast-20711:
    enabled: true
    levels: ["probe"]
    platform: "GPL570"       # Affymetrix HG-U133 Plus 2.0
    description: "Breast cancer – IHC subtypes (GSE20711)"
    n_classes: 5
    class_labels: ["Basal", "HER2", "LumA", "LumB", "Normal"]
    probe_path: "Dataset/GSE_Dataset_from_NBCI/GSE_20711/Breast_GSE20711_probe.csv"
    gene_path: "Dataset/GSE_Dataset_from_NBCI/GSE_20711/Breast_GSE20711_gene.csv"
    annotation_file: "Platform_Annotations/NBCI_platform/GPL570.annot.gz"
    mapping_file: "Dataset/GSE_Dataset_from_NBCI/GSE_20711/GSE20711_mapping.csv"

  GEO-Mesothelioma-29354:
